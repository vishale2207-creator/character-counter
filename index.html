
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 550px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 27px;
            color: #1f2937;
            margin-bottom: 10px;
        }

        .description {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #374151;
        }

        textarea {
            width: 100%;
            height: 170px;
            padding: 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #6366f1;
        }

        .counter {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 14px;
            color: #4b5563;
        }

        .progress {
            height: 6px;
            background: #e5e7eb;
            border-radius: 5px;
            margin-top: 12px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #6366f1;
            transition: width 0.2s;
        }

        #warning {
            color: #dc2626;
            font-size: 13px;
            margin-top: 12px;
            min-height: 16px;
        }

        .footer {
            border-top: 1px solid #e5e7eb;
            margin-top: 20px;
            padding-top: 15px;
            color: #9ca3af;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 22px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Character Counter</h1>

        <p class="description">
            Type your message below and track the number
            of characters in real time.
        </p>

        <label for="message">Your Message</label>

        <textarea
            id="message"
            maxlength="200"
            placeholder="Start typing here..."
        ></textarea>

        <div class="counter">
            <span><span id="count">0</span> / 200 characters</span>
            <span id="remaining">200 remaining</span>
        </div>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <p id="warning" aria-live="polite"></p>

        <div class="footer">
            Maximum limit: 200 characters
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
